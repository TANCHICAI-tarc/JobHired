<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Opening JobHired...</title>
    <script>
         (function() {
           
            const urlParams = new URLSearchParams(window.location.search);
            let encodedId = urlParams.get('id');

            
            if (!encodedId) {
             
                return;
            }

            try {
                
                encodedId = encodedId.replace(/-/g, '+').replace(/_/g, '/');
                while (encodedId.length % 4) {
                    encodedId += '=';
                }
                
                const decodedJobId = atob(encodedId).replace(/[\r\n\t]/g, '').trim();
               
                if (decodedJobId) {
                    const finalAppScheme = "jobhired://job/" + encodeURIComponent(decodedJobId);
                  

                    
                    const btn = document.getElementById("testRedirectBtn");
                    btn.href = finalAppScheme;
                    btn.style.display = "inline-block";
                    btn.innerText = "Launch Scheme (" + finalAppScheme + ")";

                    
                    window.location.replace(finalAppScheme);
                } else {
                    log("ERROR: Decoded Job ID is empty!", true);
                }
            } catch (e) {
                log("CRITICAL ERROR: " + e.message, true);
            }
        })();
    </script>
</head>
<body>
    <p>Opening job details in JobHired app...</p>
</body>
</html>
